name: Release RPM and APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SPEC_VERSION="$(rpmspec -q --queryformat '%{VERSION}' packaging/quark.spec)"
          test "$VERSION" = "$SPEC_VERSION"
          git archive --format=tar --prefix="quark-${VERSION}/" "$TAG" | gzip -n > "${RUNNER_TEMP}/quark-${VERSION}.tar.gz"
          rpmbuild -bb --nodeps \
            --define "_topdir ${GITHUB_WORKSPACE}/.rpmbuild" \
            --define "_sourcedir ${RUNNER_TEMP}" \
            packaging/quark.spec
          REQUIRES="$(rpm -qp --queryformat '[%{REQUIRENAME}\n]' .rpmbuild/RPMS/x86_64/quark-*.rpm)"
          if [[ "$REQUIRES" == *hostedtoolcache* ]]; then
            echo 'RPM depends on a build-runner Python path' >&2
            exit 1
          fi
      - name: Publish RPM in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Quark $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" .rpmbuild/RPMS/x86_64/quark-*.rpm --clobber

  android:
    needs: rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK
        env:
          QUARK_ANDROID_KEYSTORE_BASE64: ${{ secrets.QUARK_ANDROID_KEYSTORE_BASE64 }}
          QUARK_ANDROID_STORE_PASSWORD: ${{ secrets.QUARK_ANDROID_STORE_PASSWORD }}
          QUARK_ANDROID_KEY_PASSWORD: ${{ secrets.QUARK_ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUARK_ANDROID_KEYSTORE_BASE64"
          test -n "$QUARK_ANDROID_STORE_PASSWORD"
          export QUARK_ANDROID_KEYSTORE="${RUNNER_TEMP}/quark-release.p12"
          printf '%s' "$QUARK_ANDROID_KEYSTORE_BASE64" | base64 -d > "$QUARK_ANDROID_KEYSTORE"
          gradle -p android :app:assembleRelease --no-daemon
          install -m 644 android/app/build/outputs/apk/release/app-release.apk \
            "${RUNNER_TEMP}/quark-android-${GITHUB_REF_NAME}.apk"
      - name: Publish signed APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${RUNNER_TEMP}/quark-android-${GITHUB_REF_NAME}.apk" --clobber
