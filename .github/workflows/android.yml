name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quark-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Verify signed release APK
        env:
          QUARK_ANDROID_KEYSTORE_BASE64: ${{ secrets.QUARK_ANDROID_KEYSTORE_BASE64 }}
          QUARK_ANDROID_STORE_PASSWORD: ${{ secrets.QUARK_ANDROID_STORE_PASSWORD }}
          QUARK_ANDROID_KEY_PASSWORD: ${{ secrets.QUARK_ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export QUARK_ANDROID_KEYSTORE="${RUNNER_TEMP}/quark-release.p12"
          printf '%s' "$QUARK_ANDROID_KEYSTORE_BASE64" | base64 -d > "$QUARK_ANDROID_KEYSTORE"
          gradle -p android :app:assembleRelease --no-daemon
          test -s android/app/build/outputs/apk/release/app-release.apk
